    {
      "name": "RwaOutboxTargetMissing",
      "interval": "15s",
      "input_series": [],
      "alert_rule_test": [
        {
          "eval_time": "5m",
          "alertname": "RwaOutboxTargetMissing",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "rwa-outbox",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "outbox scrape job absent; monitoring may be misconfigured",
                "runbook": "MONITORING_RUNBOOK.md#targetmissing"
              }
            }
          ]
        }
      ]
    },
